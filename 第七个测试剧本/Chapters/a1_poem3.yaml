name: 1-6 第三首诗

# Act1 写诗③：最后一次点词。结算本周目倾向 → poem_winner_act1（持久）。
# 钦灵今天不在，读诗只有"她"的部分。

events:
  - type: narration
    text: |
      笔记本第三次推到你面前。
      今天的教室很安静——钦灵请假了，只有她坐在对面看着你。

  - type: music
    musicPath: none

  - type: wait
    seconds: 1.5

  - type: poem_game
    backgroundPath: '深夜诗笺-半页.png'
    musicPath: '4.ogg'
    glitchMusicPath: '4g.ogg'
    warmStickerPath: '写诗Q版-她.png'
    scriptStickerPath: '写诗Q版-钦灵.png'
    voidStickerPath: '写诗Q版-空白.png'
    wordListPath: 'poem_words.yaml'
    resultVar: 'poem_tone'
    rounds: 20
    mode: normal
    glitch: false

  - type: set_variable
    options:
      - condition: poem_tone == warm
        actions:
          - type: set_var
            content: 'warm_score += 1'
      - condition: poem_tone == script
        actions:
          - type: set_var
            content: 'script_score += 1'
      - condition: poem_tone == void
        actions:
          - type: set_var
            content: 'void_score += 1'

  # 周目倾向结算：先写 balanced 兜底，达到 2/3 票的轴再覆盖它。
  - type: set_variable
    options:
      - actions:
          - type: set_var
            content: 'poem_winner_act1 = balanced'
      - condition: warm_score == 2
        actions:
          - type: set_var
            content: 'poem_winner_act1 = her'
      - condition: warm_score == 3
        actions:
          - type: set_var
            content: 'poem_winner_act1 = her'
      - condition: script_score == 2
        actions:
          - type: set_var
            content: 'poem_winner_act1 = script'
      - condition: script_score == 3
        actions:
          - type: set_var
            content: 'poem_winner_act1 = script'
      - condition: void_score == 2
        actions:
          - type: set_var
            content: 'poem_winner_act1 = void'
      - condition: void_score == 3
        actions:
          - type: set_var
            content: 'poem_winner_act1 = void'

  - type: dialogue
    character: MAIN
    emotion: 心动
    condition: poem_tone == warm
    text: |
      【心动】三首了。你的每一首，我都有好好收着哦。
      【心动】……明天，一定要来。约好了。

  - type: dialogue
    character: MAIN
    emotion: 正常
    condition: poem_tone == script
    text: |
      【正常】你的诗，越来越像"正确答案"了。
      【正常】我不知道该高兴，还是该害怕。

  - type: dialogue
    character: MAIN
    emotion: 伤心
    condition: poem_tone == void
    text: |
      【伤心】今天的诗像一口井。
      【伤心】我往下看了一眼，里面黑黑的，好像有什么在看我。

  - type: narration
    text: |
      她把三页诗都收进笔记本，抱在胸口。
      窗外的天已经完全黑了。

  - type: dialogue
    character: MAIN
    emotion: 害羞
    text: |
      【害羞】那个……明天是周末演出日。
      【害羞】我有话想对你说。在……只有我们两个人的时候。

  - type: chapter_end
    end_type: linear
    next_chapter: 'a1_weekend'
