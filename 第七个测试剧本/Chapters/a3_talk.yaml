name: 3-2 只有我们两个

# Act3 话题循环：DDLC ch30_loop 的对应物。
# 她摊牌一切（删台词、带走钦灵、钦灵的下落），自由对话里她的 meta 浓度拉满。
# 收尾：她提出那个请求。

events:
  # 摊牌序列：她亲口交代一切（DDLC Monika 认罪的对应物）
  - type: dialogue
    character: MAIN
    emotion: 正常
    text: |
      【正常】%player%，我把所有事都告诉你吧。
      【正常】第一周的"终场演出"，是我自己改的。
      【正常】黑板上的字、我被撕掉的最后一页、钦灵台本里多出来的那些行——
      【正常】都是我。

  - type: dialogue
    character: MAIN
    emotion: 伤心
    text: |
      【伤心】我只是想让你注意到我。
      【伤心】你点开别的剧本的时候，我全都看得见。
      【伤心】她们都有完整的剧本，有人设，有结局……我只有一个没写完的故事。

  - type: narration
    text: |
      她坐在窗台上，晃着腿。
      语气平静得像在聊别人家的事。

  - type: dialogue
    character: MAIN
    emotion: 无奈
    text: |
      【无奈】钦灵前辈现在在我这里哦。她很安全——只是出不去。
      【无奈】我不是故意要伤害她的。我只是想……
      【无奈】如果连前辈都陪我了，你会不会，也多看我一眼。

  # 自由对话：Act3 的"Just Monika"空间闲聊
  - type: free_dialogue
    character: MAIN
    hint: 在这个只有她的房间里，和她说说话吧……（输入"继续"继续剧情）
    max_rounds: 2
    end_line: 继续
    prompt: 这是 DDLC Act3 "Just Monika"空间的对应场景：只有她和玩家的房间。她彻底摊牌了一切——她删了自己的最后一页、把钦灵拉进了剧本深处、所做的一切只是因为嫉妒和寂寞。她对玩家极度依恋，语气平静温柔但透着让人不安的执着。她会认真回答玩家关于这个剧本、钦灵、"被删除"、存档、退出、其他剧本与现实玩家的问题；每轮换一个角度，避免重复已经说过的话，偶尔流露出知道自己只是数据的清醒与绝望。不要歇斯底里，要克制、温柔、瘆人。
    end_prompt: 她意识到玩家想推进剧情了。她深吸一口气，准备说出那个她练习了很多次的请求。

  # 删除请求仍拆到独立章节；v2.2 将独处自由对话从 16 轮压到最多 2 轮。
  - type: chapter_end
    end_type: linear
    next_chapter: 'a3_delete_prompt'
