name: 1-5 裂缝

# v2.2 紧凑裂缝段：第一次写诗后直接进入明确异常，不再重复三天日常。
events:
  - type: background
    imagePath: '白天.webp'
    transition: 0.45

  - type: music
    musicPath: '2.ogg'
    playbackSpeed: 0.88

  - type: modify_character
    action: show_character
    character: MAIN
    emotion: 担心

  - type: narration
    text: |
      再抬头时，窗外已经是第三天。
      钦灵的椅子空着；日期从“第一天”直接跳到了“第三天”。

  - type: dialogue
    character: MAIN
    emotion: 无奈
    text: |
      【无奈】我们明明才写完第一首诗，台本却说已经过了三天。
      【无奈】还有一句话，一直有人塞进我的嘴里——

  - type: sound
    soundPath: 'eyes.ogg'

  - type: background_effect
    effect: 'Tear+Static'
    duration: 0.28

  - type: dialogue
    character: MAIN
    emotion: 崩坏
    text: |
      【崩坏】“等你关掉窗口以后，我们才可以动。”

  - type: modify_character
    action: show_character
    character: ql
    emotion: 害怕

  - type: dialogue
    character: ql
    emotion: 害怕
    text: |
      【害怕】别念出来！那不是给角色看的台词！
      【害怕】周末演出提前了。今晚就开始——谁都不许退出。

  - type: horror_log
    text: 'FAST_FORWARD // day_1 -> day_3 // skipped dialogue still remembers you'
    lines: 8

  - type: narration
    displayName: RUNTIME
    text: '> FAST_FORWARD COMPLETE // skipped dialogue is still running'

  - type: dialogue
    character: MAIN
    emotion: 伤心
    text: |
      【伤心】%player%，再写最后一首诗就来找我。
      【伤心】如果明天只剩一个人……不要相信她说自己没事。

  - type: chapter_end
    end_type: linear
    next_chapter: 'a1_poem3'
