name: 2-1 没有她的部室

# Act2 第一天：DDLC ch20 的对应物——没有她的世界。
# 钦灵独自在教室，台本里"她"被整段抹掉。钦灵偶尔说出不属于自己的话。

events:
  - type: modify_character
    action: show_character
    character: ql
    emotion: 正常

  - type: dialogue
    character: ql
    emotion: 正常
    text: |
      【正常】新人，你来啦。
      【正常】今天的安排是……唔，等我看下台本。

  - type: narration
    text: |
      钦灵翻开台本。
      第一页有三行被涂掉了。涂得很干净，像从来没有写过。

  - type: dialogue
    character: ql
    emotion: 疑惑
    text: |
      【疑惑】奇怪……我们部门，是不是应该有……两个人？
      【疑惑】不对。台本上只有我一个。一定是我记错了。

  # DDLC 式篡改：她的存在被"编辑"掉了
  - type: narration
    text: |
      你张了张嘴，想说出一个名字。
      那个名字就在你嘴边——
      可你突然想不起来，那是谁的名字。

  - type: dialogue
    character: ql
    emotion: 高兴
    text: |
      【高兴】算啦不想了！今天就我们两个，也挺好的嘛。
      【高兴】前辈我呀，一个人也能把流程跑完哦。

  # 钦灵的第一句"黑话"：夹在正常台词里的违和（DDLC edited 风格）
  - type: dialogue
    character: ql
    emotion: 正常
    text: |
      【正常】毕竟，空着的台词位总要有角色来填。
      【正常】……诶？我刚才说什么？

  - type: narration
    text: |
      钦灵自己也愣住了。
      她摇摇头，尾巴烦躁地甩了一下。

  - type: dialogue
    character: ql
    emotion: 害羞
    text: |
      【害羞】哈哈，没睡好没睡好。别在意！
      【害羞】来，今天也写一首诗吧。这是传统，不能断。

  # 钦灵转身时立绘崩坏一闪（低概率叠加：她的乱码残影也可能出现）
  - type: modify_character
    character: ql
    emotion: 崩坏1
    flash: true
    duration: 0.18
    condition: rare_portrait_glitch == true

  - type: background_effect
    effect: 'Static'
    duration: 0.18
    condition: rare_portrait_glitch == true

  - type: chapter_end
    end_type: linear
    next_chapter: 'a2_poem1'
