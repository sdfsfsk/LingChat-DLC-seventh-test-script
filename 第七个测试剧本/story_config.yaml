script_name: 第七个测试剧本
intro_chapter: boot
description: 一个本不该出现在列表里的剧本。※ 强烈恐怖演出，含抑郁/自残/自杀暗示，建议 18 岁以上、心理承受力较强者游玩
recommand_start: 深夜一个人的时候
content_warning: horror
editor_locked: true

script_settings:
  user_name: ""
  # 仅这些变量会写入 data/script_runtime_state.json；普通分支变量不会跨局污染。
  persistent_vars:
    - playthrough
    - last_ending
    # DDLC 式一次性彩蛋标记：眼睛闪图/三张特殊诗在同一存档维度各只投放一次
    - seen_eyes
    - seen_poem_1
    - seen_poem_2
    - seen_poem_3
