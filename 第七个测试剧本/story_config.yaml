# 《第七个测试剧本》v2.0 — 原创 meta 恐怖剧本（DLC 发行版）
# 四幕结构（映射 DDLC 玩法骨架，内容全原创）：
#   current_act==1  Act1 日常幕：a1_day1 → 三次写诗 → a1_weekend → a1_end（她的死亡冲击）
#   current_act==2  Act2 崩坏幕：a2_boot → 三次写诗且各投放一张特殊诗 → a2_end（钦灵三阶段删除）
#   current_act==3  Act3 独占空间：a3_space → a3_talk → 删除/留下
#   current_act==4  Act4 结局幕：a4_main → a4_turn → a4_final（先按 release/loop 拆章）
#   act4_done==true 后日谈：a5_lingering（空房间/彩蛋）
# current_act 只在幕末推进；playthrough 仅记录打开次数，退出重开不会直接跳幕。
# 进入前触发 18+ 恐怖内容警告；剧本编辑器不可编辑（editor_locked 自锁，引擎零硬编码）
script_name: 第七个测试剧本
intro_chapter: a1_boot
description: 欢迎来到文学测试部。※ 多周目 meta 恐怖，含抑郁/自残/自杀暗示与强烈崩坏演出，建议 18 岁以上、心理承受力较强者游玩
recommand_start: 深夜一个人的时候
content_warning: horror
editor_locked: true

script_settings:
  user_name: ""
  # 跨幕记忆（写入 data/script_runtime_state.json）：
  # playthrough=打开次数；current_act=剧情幕（只在幕末推进）；act4_done=后日谈门；
  # last_ending=release/loop；seen_poem_1~3=三张特殊诗；poem_winner_act1=Act1 累计倾向。
  persistent_vars:
    - playthrough
    - current_act
    - act4_done
    - act3_visits
    - last_ending
    - seen_poem_1
    - seen_poem_2
    - seen_poem_3
    - poem_winner_act1
    - act2_broken
